<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="燕雀 No.54収録『小さな特別』、ルフィナによる作品紹介。"><title>作品紹介｜文藝部</title><style>
    :root { --paper:#f4f0e6; --ink:#292e2b; --muted:#65685e; --red:#963e30; --line:#d2cbbc; --indigo:#294c57; }

    .shelf:has(> .book:only-child) { grid-template-columns:minmax(0,780px); justify-content:center; }

    .book-stage { height:310px; background:#e8e3d7; background-image:linear-gradient(90deg,#b2a68e15 1px,transparent 1px),linear-gradient(#b2a68e15 1px,transparent 1px); background-size:30px 30px; display:flex; justify-content:center; align-items:center; perspective:1000px; position:relative; margin-bottom:25px; }
    .book-cover { width:165px; height:235px; background:var(--cover,var(--indigo)); color:var(--paper); border-left:7px solid #0003; box-shadow:6px 6px 0 #d5cebd,15px 20px 23px #302e2726; position:relative; display:flex; align-items:center; justify-content:center; transform:rotate(-6deg); transition:transform .65s,box-shadow .65s; }
    .book-stage:hover .book-cover { transform:rotate(0) rotateY(-12deg) translateY(-5px); box-shadow:8px 8px 0 #d5cebd,20px 25px 30px #302e2733; }
    .book-cover::before { content:""; position:absolute; inset:12px; border:1px solid #f4f0e677; pointer-events:none; }

    .cover-image { width:100%; height:100%; object-fit:contain; background:var(--paper); }

    .book-category { font-size:10px; letter-spacing:.15em; color:var(--red); margin:0 0 8px; }
    h2 { font-weight:500; font-size:23px; letter-spacing:.1em; margin:0 0 12px; overflow-wrap:anywhere; }
    .meta { display:flex; flex-wrap:wrap; gap:4px 16px; color:var(--muted); font-size:11px; margin:0 0 15px; }

    .actions { display:flex; flex-wrap:wrap; gap:12px 25px; margin-top:23px; }
    .action { display:inline-flex; align-items:center; gap:20px; border-bottom:1px solid var(--ink); font-size:12px; padding:7px 0; transition:color .3s; }
    .action:hover { color:var(--red); }
    .action span { transition:transform .3s; }
    .action:hover span { transform:translateX(4px); }
    .excerpt { margin:25px 0 0; padding:25px 22px; background:#fff6; border-left:2px solid var(--red); }
    .excerpt-label { color:var(--red); font-size:10px; letter-spacing:.2em; margin:0 0 12px; }
    .excerpt h3 { font-size:17px; font-weight:500; letter-spacing:.12em; margin:0 0 6px; }
    .excerpt-author { font-size:11px; color:var(--muted); margin:0 0 20px; }
    .excerpt blockquote { margin:0; font-size:14px; line-height:2.4; overflow-wrap:anywhere; }
    .excerpt-line { display:block; white-space:pre-wrap; }
    .excerpt-line + .excerpt-line { margin-top:12px; }
    .motion .excerpt-line { opacity:0; transform:translateY(12px); transition:opacity 1s ease,transform 1s ease; transition-delay:var(--delay,0s); }
    .motion .excerpt-line.visible { opacity:1; transform:none; }
    .excerpt-note { font-size:10px; color:var(--muted); margin:18px 0 0; letter-spacing:.1em; }
    .contents { margin-top:25px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .contents summary { cursor:pointer; padding:17px 0; font-size:13px; letter-spacing:.1em; color:var(--red); }
    .contents summary:focus-visible { outline:2px solid var(--red); outline-offset:4px; }
    .contents-list { margin:0; padding:0 0 15px; list-style:none; }
    .contents-item { display:flex; justify-content:space-between; align-items:baseline; gap:15px; padding:12px 0; border-top:1px dashed var(--line); }
    .contents-title { font-size:14px; overflow-wrap:anywhere; }
    .contents-meta { display:block; font-size:10px; color:var(--muted); margin-top:3px; }
    .contents-page { font-size:11px; color:var(--muted); white-space:nowrap; }
    .pending { font-size:11px; color:var(--muted); padding:7px 0; }
    .empty { text-align:center; color:var(--muted); padding:50px 0 70px; }
    [hidden] { display:none!important; }
    .end-note { border-top:1px solid var(--line); padding:35px 0 65px; font-size:12px; color:var(--muted); }
    .end-note a { border-bottom:1px solid var(--line); }

    .footer-inner { display:flex; justify-content:space-between; align-items:center; gap:20px; }
    .footer-brand { font-size:24px; letter-spacing:.3em; }
    .footer p { font-size:10px; opacity:.65; letter-spacing:.15em; margin:8px 0 0; }
    .footer a { font-size:12px; border-bottom:1px solid #f4f0e655; }

    @keyframes ink { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @media(max-width:700px) { .wrap{width:calc(100% - 40px)} .shelf{gap:35px 25px} .header-inner{min-height:75px} nav{gap:16px;font-size:12px} .brand-name{font-size:21px} .heading-seal{font-size:17px;right:5px} .intro{max-width:80%} .book-stage{height:280px} }
    @media(max-width:500px) { .header-inner{flex-wrap:wrap;padding:15px 0;gap:12px} nav{width:100%;justify-content:space-between} .page-heading{padding:45px 0} .heading-seal{top:50px;font-size:15px} .intro{max-width:85%;font-size:13px} .tools{flex-wrap:wrap;gap:15px} .search-field{flex-basis:100%;max-width:none} .count{margin-bottom:10px} .shelf{grid-template-columns:1fr;padding-top:35px} .book-stage{height:310px} .notice{font-size:9px} .footer a{font-size:11px} }
    @media(prefers-reduced-motion:reduce) { .motion .excerpt-line{opacity:1;transform:none}  html{scroll-behavior:auto} *,*::before,*::after{animation:none!important;transition:none!important} }

<main id="main" class="wrap"><article class="story"><p class="eyebrow">書き手の言葉 / STORIES</p><h2 style="font-size:40px">作品紹介</h2><p>物語に添える、もうひとつの言葉。<br>書き手自身が綴る作品の紹介を集めました。</p><div id="work-list"></div><noscript><a href="chiisana-tokubetsu.html">小さな特別 — ルフィナ</a></noscript><a class="action" href="books.html">部誌の表紙と収録作品の目次はこちら →</a></article></main><footer class="footer"><div class="wrap footer-inner"><div class="footer-brand">文藝部</div><a href="#top">頁のはじめへ ↑</a></div></footer><script>
// 希望する作者の作品紹介を追加します。1件をコピーして各項目を書き換えてください。
// 紹介文の本体はurlで指定したHTMLの「作者から」欄に書きます。
const WORKS = [{title:"小さな特別",author:"ルフィナ",issue:"燕雀 No.54",url:"chiisana-tokubetsu.html",summary:"作者の紹介文は「作品紹介を読む」からご覧いただけます。"}];
for(const work of WORKS){const card=document.createElement('section');card.className='author-note reveal';for(const [tag,text] of [['p',work.issue],['h2',work.title],['p',work.author],['p',work.summary]]){const el=document.createElement(tag);el.textContent=text;card.append(el);}const url=new URL(work.url,location.href);if(url.origin!==location.origin)continue;const a=document.createElement('a');a.className='action';a.href=url.href;a.textContent='作品紹介を読む →';card.append(a);document.getElementById('work-list').append(card);
const summary = card.querySelectorAll('p')[2];
fetch(url.href, {cache:'no-store'}).then(response => {if(!response.ok)throw new Error('Introduction unavailable');return response.text();}).then(html => {
 const doc = new DOMParser().parseFromString(html,'text/html');
 const first = doc.getElementById('author-introduction');
 if(!first)return;
 const paragraphs = [];
 for(let node=first;node && node.tagName==='P';node=node.nextElementSibling){const text=node.textContent.trim();if(text)paragraphs.push(text);}
 if(paragraphs.length)summary.textContent=paragraphs.join('\n\n');
}).catch(()=>{});
}
</script></body></html>
